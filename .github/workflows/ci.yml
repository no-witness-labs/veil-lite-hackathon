name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  daml:
    name: Daml build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DPM_HOME: /home/runner/.dpm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install DPM
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://get.digitalasset.com/install/install.sh | sh
          echo "${DPM_HOME}/bin" >> "${GITHUB_PATH}"
          "${DPM_HOME}/bin/dpm" version

      - name: Install Daml SDK 3.5.1
        run: |
          set -euo pipefail
          dpm install 3.5.1
          test "$(dpm version --active)" = '3.5.1'

      - name: Build production Daml package
        run: dpm build

      - name: Build and test Daml test package
        working-directory: test
        run: |
          set -euo pipefail
          dpm build
          test -s daml/Veil/Test.daml
          grep -Eq '^test[A-Za-z0-9_]+[[:space:]]*:[[:space:]]*Script[[:space:]]*\(\)' daml/Veil/Test.daml
          dpm test --detail 1
