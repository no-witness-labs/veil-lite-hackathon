sdk-version: 3.5.1
name: veil-lite
source: daml
version: 0.8.1
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - vendor/splice-token-standard/splice-api-token-metadata-v1-1.0.0.dar
  - vendor/splice-token-standard/splice-api-token-holding-v2-1.0.0.dar
  - vendor/splice-token-standard/splice-api-token-allocation-v2-1.0.0.dar
  - vendor/splice-token-standard/splice-api-token-allocation-instruction-v2-1.0.0.dalf
build-options:
