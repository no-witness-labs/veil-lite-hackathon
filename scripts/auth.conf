# Local Canton JWT authentication for the Veil sandbox.
#
# local-auth.mjs creates cert.pem from the matching RSA key before dpm sandbox
# starts.  Keep the audience fixed so the API and UI can validate the same
# tokens without discovering a participant-specific default audience.
canton.participants.sandbox.ledger-api {
  auth-services = [{
    type = jwt-rs-256-crt
    certificate = "./.local/auth/cert.pem"
    target-audience = "veil-local"
  }]
  user-management-service.enabled = true
}
